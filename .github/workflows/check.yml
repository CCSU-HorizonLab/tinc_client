name: build-and-test
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev build-essential libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm run build
      - run: npm run test:ui
      - run: npm run test:packaging
      - run: cargo fmt --all --check
      - run: cargo test --locked --workspace --exclude tinc-desktop
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo build --locked -p vpn-agent -p tinc-desktop
      - run: cargo build --locked -p vpn-agent --example process_fixture
      - run: npm run test:e2e
      - if: runner.os == 'Windows'
        name: Build Windows release binaries
        run: cargo build --locked --release -p vpn-agent -p tinc-desktop
      - if: runner.os == 'Linux'
        run: npm run tauri --workspace apps/desktop -- build --bundles deb
