[workspace]
members = ["apps/agent", "apps/desktop/src-tauri", "crates/vpn-core", "crates/vpn-ipc", "crates/platform-windows", "crates/platform-linux"]
default-members = ["apps/agent", "crates/vpn-core", "crates/vpn-ipc"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "2"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Memory", "Win32_System_Threading", "Win32_System_Pipes", "Win32_System_JobObjects", "Win32_System_Services"] }
